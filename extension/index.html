<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>KEYFRAME Infinity</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#232323;color:#cfcfcf;font:11px/1.35 'Segoe UI','Yu Gothic UI','Hiragino Sans',sans-serif;overflow:hidden;user-select:none;cursor:default}
  #main{padding:5px 8px 4px;cursor:pointer}
  #row{display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
  #f{color:#fff;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  #r{color:#3ddc97;font-family:Consolas,monospace;font-size:10.5px}
  #fl{color:#ffb020;font-size:10.5px}
  #bar{height:3px;margin:4px 0 3px;background:#151515;border-radius:2px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35d6ed,#7f5bff,#ffb020)}
  #s{color:#8b8b8b;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #more{display:none;border-top:1px solid #111;padding:6px 8px;overflow:auto;position:absolute;left:0;right:0;top:56px;bottom:0}
  body.open #more{display:block}
  pre{font:10.5px/1.5 'Segoe UI','Yu Gothic UI',sans-serif;white-space:pre-wrap;color:#bdbdbd;user-select:text}
  label{display:flex;align-items:center;gap:5px;margin:7px 0 6px}
  button{font:inherit;color:#eee;background:#3a3a3a;border:1px solid #4a4a4a;border-radius:3px;padding:3px 10px;margin-right:4px;cursor:pointer}
  button:hover{background:#474747}
  button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div id="main" title="クリックで詳細を開閉">
  <div id="row"><span id="f">0 F</span><span id="r"></span><span id="fl"></span></div>
  <div id="bar" title="次の着想(✺)まで"><i id="b"></i></div>
  <div id="s"></div>
</div>
<div id="more">
  <pre id="st"></pre>
  <label><input type="checkbox" id="auto"> 書き出し・アワード・レガシーを自動で行う</label>
  <button id="ex">今すぐ書き出す</button><button id="rs">リセット</button>
</div>
<script src="js/core.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
