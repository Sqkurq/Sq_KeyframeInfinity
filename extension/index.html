<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>KEYFRAME Infinity</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#232323;color:#cfcfcf;font:11px/1.35 'Segoe UI','Yu Gothic UI','Hiragino Sans',sans-serif;overflow:hidden;user-select:none;cursor:default}
  #main{padding:5px 8px 4px}
  #row{display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
  #f{color:#fff;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  #r{color:#3ddc97;font-family:Consolas,monospace;font-size:10.5px}
  #w{color:#8fb8ff;font-size:10.5px;font-variant-numeric:tabular-nums}
  #fl{color:#ffb020;font-size:10.5px}
  #bar{height:3px;margin:4px 0 3px;background:#151515;border-radius:2px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#35d6ed,#7f5bff,#ffb020)}
  #s{color:#8b8b8b;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="main">
  <div id="row"><span id="f">0 F</span><span id="r"></span><span id="w"></span><span id="fl"></span></div>
  <div id="bar" title="次の着想(✺)まで"><i id="b"></i></div>
  <div id="s"></div>
</div>
<script src="js/core.js"></script>
<script src="js/panel.js"></script>
</body>
</html>
